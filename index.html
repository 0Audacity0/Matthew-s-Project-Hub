<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew's Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space-black: #030305;      /* Outer Space Black background */
    --ink: #eceef2;
    --muted: #8b90a0;
    --line: rgba(255, 255, 255, 0.12);
    --panel: rgba(18, 19, 26, 0.92);
    --accent: #7aa2ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--space-black);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body { min-height: 100vh; }

  /* ---------- Fade in + move up on load ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    animation: riseIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: calc(var(--i, 0) * 120ms + 100ms);
  }
  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Animated background ---------- */
  #glow {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 34% at 18% 24%, rgba(88, 101, 242, 0.17), transparent 70%),
      radial-gradient(34% 30% at 82% 68%, rgba(0, 190, 175, 0.11), transparent 70%),
      radial-gradient(30% 28% at 72% 14%, rgba(168, 92, 225, 0.12), transparent 70%),
      radial-gradient(28% 26% at 28% 82%, rgba(60, 140, 255, 0.10), transparent 70%);
    animation: glowDrift 45s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes glowDrift {
    from { transform: translate3d(-2%, -1.5%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.1); }
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    transform: translateZ(0);
  }
  main { position: relative; z-index: 1; }

  /* ---------- Version label (top left) ---------- */
  .version {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 20;
    height: 38px;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    user-select: none;
  }

  /* ---------- Info button ---------- */
  .top-right {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 20;
    display: flex;
    align-items: stretch;
    gap: 10px;
  }
  .info-btn {
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .info-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }

  .mute-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    padding: 0;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .mute-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .mute-btn svg { width: 20px; height: 20px; display: block; }
  .mute-btn .icon-off { display: none; }
  .mute-btn.muted .icon-on { display: none; }
  .mute-btn.muted .icon-off { display: block; }
  .mute-btn.muted { color: var(--muted); }

  .info-btn:focus-visible, .mute-btn:focus-visible, .close-btn:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ---------- Main content ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 90px 24px 120px;
  }

  section { margin-bottom: 72px; }

  h1.section-title {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 8px;
  }

  .section-rule {
    height: 1px;
    background: var(--line);
    margin: 18px 0 26px;
  }

  .empty {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
  }

  /* ---------- Website boxes ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .card {
    --mx: 50%;
    --my: 50%;
    position: relative;
    display: block;
    overflow: hidden;
    padding: 18px 20px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(40, 42, 54, 0.78), rgba(14, 15, 22, 0.78));
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 10px 26px rgba(0, 0, 0, 0.3);
    color: inherit;
    text-decoration: none;
    transition: transform 0.25s ease, border-color 0.25s, box-shadow 0.25s;
  }
  /* soft spotlight that follows the cursor */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    background: radial-gradient(240px circle at var(--mx) var(--my), rgba(122, 162, 255, 0.2), transparent 65%);
  }
  /* thin glowing line along the top edge */
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 1px;
    pointer-events: none;
    opacity: 0.35;
    transition: opacity 0.25s;
    background: linear-gradient(90deg, transparent, rgba(122, 162, 255, 0.8), transparent);
  }
  .card > * { position: relative; }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(122, 162, 255, 0.55);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset, 0 16px 34px rgba(0, 0, 0, 0.4), 0 0 28px rgba(122, 162, 255, 0.16);
  }
  .card:hover::before, .card:hover::after { opacity: 1; }
  .card-title {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-arrow {
    flex: none;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.3;
    transition: transform 0.25s ease, color 0.25s;
  }
  .card:hover .card-arrow { transform: translate(3px, -3px); color: var(--accent); }
  .card-desc { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

  .warn {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    color: #ffc978;
    background: rgba(255, 190, 90, 0.12);
    border: 1px solid rgba(255, 190, 90, 0.35);
    border-radius: 999px;
  }

  .warn.tablet {
    color: #f3e08a;
    background: rgba(240, 215, 90, 0.10);
    border-color: rgba(240, 215, 90, 0.32);
  }

  .preview-box {
    margin-top: 12px;
    padding: 9px 12px;
    font-size: 13px;
    line-height: 1.45;
    color: #ff9a9a;
    background: rgba(255, 70, 70, 0.12);
    border: 1px solid rgba(255, 80, 80, 0.5);
    border-radius: 8px;
  }
  .preview-box strong { color: #ff6b6b; font-weight: 700; }

  .new-box {
    margin-top: 12px;
    padding: 9px 12px;
    font-size: 13px;
    line-height: 1.45;
    color: #9be8b0;
    background: rgba(70, 220, 120, 0.12);
    border: 1px solid rgba(80, 220, 130, 0.5);
    border-radius: 8px;
  }
  .new-box strong { color: #5fe08a; font-weight: 700; }

  /* ---------- Dropdown (Home-made Projects) ---------- */
  .more-wrap { margin-top: -40px; padding-bottom: 20px; }

  .more-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .more-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .more-btn .chev { display: inline-block; transition: transform 0.3s; font-size: 12px; }
  .more-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .dropdown {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.45s ease;
  }
  .dropdown.open { grid-template-rows: 1fr; }
  .dropdown-inner {
    min-height: 0;
    overflow: hidden;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .dropdown.open .dropdown-inner { visibility: visible; opacity: 1; }
  .dropdown-inner > .dropdown-content { padding-top: 48px; }

  /* ---------- Info popup ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .info-box {
    width: min(460px, 100%);
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 28px 28px;
    transform: translateY(14px) scale(0.98);
    transition: transform 0.25s;
  }
  .overlay.open .info-box { transform: none; }

  .info-box h2 {
    margin: 0 0 14px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
  }
  .info-box p {
    margin: 0 0 14px;
    color: #c9ccd6;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-line;
  }

  .close-btn {
    display: block;
    margin: 18px auto 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .close-btn:hover { background: rgba(255, 255, 255, 0.1); }

  /* ---------- Codes button (bottom right, almost invisible) ---------- */
  .codes-btn {
    position: fixed;
    bottom: 14px;
    right: 16px;
    z-index: 20;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    opacity: 0.05;
    transition: opacity 0.3s;
  }
  .codes-btn:hover, .codes-btn:focus-visible { opacity: 0.5; }
  .codes-btn:focus-visible { outline: 2px solid var(--accent); }

  /* Codes panel: docked at the bottom of the screen, no blur */
  .codes-panel {
    position: fixed;
    left: 50%;
    bottom: 56px;
    z-index: 25;
    width: min(520px, calc(100% - 32px));
    padding: 12px 14px 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    transform: translate(-50%, 20px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
  }
  .codes-panel.open { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  .codes-panel form { display: flex; align-items: center; gap: 10px; }
  .codes-label { font-weight: 700; font-size: 15px; }
  .codes-panel .code-input { flex: 1; min-width: 0; width: auto; }
  .enter-btn {
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: #0b0d14;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .enter-btn:hover { filter: brightness(1.15); }
  .enter-btn:focus-visible, .x-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .x-btn {
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
  }
  .x-btn:hover { color: var(--ink); }
  .codes-panel .code-msg { margin: 8px 0 0; }

  .code-input {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    outline: none;
  }
  .code-input:focus { border-color: rgba(122, 162, 255, 0.6); }
  .code-msg { min-height: 20px; margin: 12px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
  .code-msg.ok { color: #8be0a4; }
  .code-msg.bad { color: #ff9a9a; }

  /* Effects triggered by codes */
  body.rainbow #glow, body.rainbow #bg {
    filter: saturate(3) brightness(2.2);
    animation: hueSpin 6s linear infinite;
  }
  body.rainbow #glow { animation: glowDrift 45s ease-in-out infinite alternate, hueSpin 6s linear infinite; }
  body.rainbow .card, body.rainbow .section-rule { animation: hueSpin 6s linear infinite; }
  @keyframes hueSpin {
    from { filter: saturate(3) brightness(2.2) hue-rotate(0deg); }
    to   { filter: saturate(3) brightness(2.2) hue-rotate(360deg); }
  }
  body.flip main { transform: rotate(180deg); }
  main { transition: transform 0.8s; }

  /* ---------- All Codes list (text box with close button) ---------- */
  .codes-list {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 26;
    width: min(440px, calc(100% - 32px));
    max-height: 70vh;
    overflow-y: auto;
    padding: 22px 24px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    transform: translate(-50%, -46%);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
  }
  .codes-list.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
  .codes-list h2 { margin: 0 0 12px; text-align: center; font-size: 22px; font-weight: 700; }
  .codes-list ul { margin: 0; padding: 0; list-style: none; }
  .codes-list li { padding: 8px 0; border-top: 1px solid var(--line); color: #c9ccd6; font-size: 14px; line-height: 1.5; }
  .codes-list li strong { color: var(--ink); }

  /* ---------- Custom scrollbar (the slider on the side) ---------- */
  @supports selector(::-webkit-scrollbar) {
    /* slim, minimal, see-through pill that lights up blue on hover */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 999px;
      background: rgba(236, 238, 242, 0.26) padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(122, 162, 255, 0.9) padding-box; }
    ::-webkit-scrollbar-thumb:active { background: #7aa2ff padding-box; }
    ::-webkit-scrollbar-corner { background: transparent; }
    html:has(body.bearbones)::-webkit-scrollbar-track { background: repeating-linear-gradient(0deg, #ff0 0 6px, #f0f 6px 12px) !important; }
    html:has(body.bearbones)::-webkit-scrollbar-thumb { background: #c0c0c0 !important; border: 3px outset #fff !important; border-radius: 0 !important; box-shadow: none !important; }
  }
  @supports not selector(::-webkit-scrollbar) {
    html, .info-box, .codes-list { scrollbar-width: thin; scrollbar-color: rgba(236, 238, 242, 0.3) transparent; }
  }


  /* ---------- More code effects ---------- */
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: none; }
  #dark {
    position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none;
    background: radial-gradient(circle 230px at var(--fx, 50%) var(--fy, 50%), transparent 0, rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0.97) 100%);
  }
  body.flashlight #dark { display: block; }

  html.invert { filter: invert(1) hue-rotate(180deg); }

  body.terminal { --ink: #33ff66; --muted: #1fae45; --line: rgba(51, 255, 102, 0.35); --accent: #33ff66; --panel: rgba(0, 14, 4, 0.96); }
  body.terminal, body.terminal * { font-family: "Courier New", ui-monospace, monospace !important; }
  body.terminal #glow, body.terminal #bg { filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(4); }
  body.terminal .card { background: rgba(0, 30, 8, 0.55); }
  body.terminal::after {
    content: ""; position: fixed; inset: 0; z-index: 45; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
  }

  body.disco #glow { filter: saturate(3) brightness(2.4); animation: glowDrift 45s ease-in-out infinite alternate, hueSpin 1.4s linear infinite; }
  body.disco .card { animation: discoPulse 0.55s ease-in-out infinite alternate; }
  @keyframes discoPulse {
    from { border-color: #ff2bd6; box-shadow: 0 0 12px #ff2bd6, inset 0 0 14px rgba(255, 43, 214, 0.35); transform: translateY(0); }
    to   { border-color: #2bffe9; box-shadow: 0 0 28px #2bffe9, inset 0 0 14px rgba(43, 255, 233, 0.35); transform: translateY(-6px); }
  }

  body.coolbg #glow { filter: saturate(1.9) brightness(1.7); }
  body.coolbg .card { border-color: rgba(160, 140, 255, 0.28); }

  body.shake .card, body.shake .section-title { animation: shakeIt 0.8s ease-in-out; }
  @keyframes shakeIt {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    10% { transform: translate(-9px, 4px) rotate(-1.5deg); }
    25% { transform: translate(8px, -5px) rotate(1.5deg); }
    40% { transform: translate(-7px, 6px) rotate(-1deg); }
    55% { transform: translate(7px, -4px) rotate(1deg); }
    70% { transform: translate(-4px, 3px) rotate(-0.5deg); }
    85% { transform: translate(3px, -2px) rotate(0.5deg); }
  }
  body.spin .card { animation: spinOnce 1.3s cubic-bezier(0.5, 0, 0.2, 1); }
  @keyframes spinOnce { from { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(0.8); } to { transform: rotate(360deg) scale(1); } }

  /* ---------- BearBones: the ugly, cheap, scuffed look ---------- */
  html:has(body.bearbones) { background: #ff00ff !important; }
  body.bearbones {
    background: repeating-linear-gradient(45deg, #ff00ff 0 12px, #00ffff 12px 24px) !important;
    color: #000 !important;
    cursor: crosshair;
  }
  body.bearbones *, body.bearbones *::before, body.bearbones *::after {
    font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive !important;
    animation: none !important;
    transition: none !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    text-shadow: 1px 1px 0 #ff0 !important;
  }
  body.bearbones #glow, body.bearbones #bg, body.bearbones .card::before, body.bearbones .card::after { display: none !important; }
  body.bearbones .reveal { opacity: 1 !important; transform: none !important; }
  body.bearbones main::before {
    content: "*** UNDER CONSTRUCTION *** WELCOME TO MY HOMEPAGE!!! ***";
    display: block;
    margin-bottom: 24px;
    padding: 6px;
    background: #ffff00;
    color: #ff0000;
    border: 4px dashed #000;
    font-weight: 700;
    text-align: center;
  }
  body.bearbones h1.section-title { color: #ff0000 !important; text-decoration: underline wavy #0000ff; font-size: 34px !important; letter-spacing: 0 !important; }
  body.bearbones .section-rule { height: 6px !important; background: repeating-linear-gradient(90deg, #000 0 8px, #ff0 8px 16px) !important; }
  body.bearbones .version { color: #ff0000 !important; }
  body.bearbones .card, body.bearbones .info-btn, body.bearbones .mute-btn, body.bearbones .more-btn, body.bearbones .close-btn,
  body.bearbones .enter-btn, body.bearbones .x-btn, body.bearbones .info-box, body.bearbones .codes-panel, body.bearbones .codes-list {
    background: #c0c0c0 !important;
    color: #000 !important;
    border: 4px outset #ffffff !important;
  }
  body.bearbones .card:nth-child(odd) { transform: rotate(-1.5deg); }
  body.bearbones .card:nth-child(even) { transform: rotate(1deg); }
  body.bearbones .card:hover { transform: rotate(3deg) scale(1.03) !important; }
  body.bearbones .card-title { color: #0000ee !important; text-decoration: underline; font-size: 18px !important; }
  body.bearbones .card-desc, body.bearbones .info-box p, body.bearbones .codes-list li, body.bearbones .codes-list li strong { color: #000 !important; }
  body.bearbones .card-arrow { color: #ff0000 !important; }
  body.bearbones .code-input { background: #fff !important; color: #000 !important; border: 3px inset #888 !important; }
  body.bearbones .codes-label, body.bearbones .codes-list h2, body.bearbones .info-box h2 { color: #000 !important; }
  body.bearbones .code-msg { color: #000 !important; text-shadow: none !important; font-weight: 700; }
  body.bearbones .code-msg.bad { color: #ff0000 !important; }
  body.bearbones .warn { color: #000 !important; background: #ffff00 !important; border: 2px solid #000 !important; text-shadow: none !important; }
  body.bearbones .preview-box, body.bearbones .new-box { color: #000 !important; background: #ffff00 !important; border: 2px solid #000 !important; text-shadow: none !important; }

function makeCard(site) {

    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  const name = document.createElement("h3");
  name.className = "card-title";
  name.textContent = site.name;
  const arrow = document.createElement("span");
  arrow.className = "card-arrow";
  arrow.setAttribute("aria-hidden", "true");
  arrow.textContent = "\u2197";
  if (!(site.preview === true || String(site.preview).toLowerCase() === "yes")) name.appendChild(arrow);
  card.appendChild(name);

  if (site.description) {
    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = site.description;
    card.appendChild(desc);
  }

  if (site.mobile === false || site.mobile === "tablet") {
    const warn = document.createElement("span");
    warn.className = "warn" + (site.mobile === "tablet" ? " tablet" : "");
    warn.textContent = site.mobile === "tablet"
      ? "\u26A0 Works on tablets, probably not phones"
      : "\u26A0 Not mobile supported";
    card.appendChild(warn);
  }
  if (site.preview === true || String(site.preview).toLowerCase() === "yes") {
    const box = document.createElement("div");
    box.className = "preview-box";
    box.innerHTML = "<strong>\u26A0 Placeholder</strong><br>This project is a placeholder and has not been released yet.";

    // Placeholder projects don't open; they show the "be patient" popup instead
    card.addEventListener("click", e => {

      openSoon(site.releaseDate);

  }
  if (!(site.preview === true || String(site.preview).toLowerCase() === "yes") &&
      (site.new === true || String(site.new).toLowerCase() === "yes")) {

    nbox.className = "new-box";

  return card;

/* Matrix rain (used by the "matrix" code) */
const RAIN = (function () {
  const c = document.getElementById("rain");
  const x = c.getContext("2d");
  const FS = 17;
  const CH = "アイウエオカキクケコサシスセソ0123456789ABCDEFZ";
  let on = false, drops = [], raf = 0, last = 0;
  function size() {
    c.width = window.innerWidth; c.height = window.innerHeight;
    drops = Array.from({ length: Math.ceil(c.width / FS) }, () => -Math.random() * 40);
  }
  function draw(now) {
    if (!on) return;
    raf = requestAnimationFrame(draw);
    if (now - last < 55) return;
    last = now;
    x.globalCompositeOperation = "destination-out";
    x.fillStyle = "rgba(0,0,0,0.14)";
    x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = "source-over";
    x.font = FS + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const ch = CH[(Math.random() * CH.length) | 0];
      const px = i * FS, py = drops[i] * FS;
      x.fillStyle = "#d6ffe2";
      x.fillText(ch, px, py);
      x.fillStyle = "rgba(40,255,110,0.9)";
      x.fillText(CH[(Math.random() * CH.length) | 0], px, py - FS);
      if (py > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  function start() { size(); x.clearRect(0, 0, c.width, c.height); c.style.display = "block"; on = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  function stop() { on = false; cancelAnimationFrame(raf); c.style.display = "none"; }
  window.addEventListener("resize", () => { if (on) size(); });
  return { toggle: () => { on ? stop() : start(); return on; }, stop: stop };
})();

  let cool = false, coolT = 0;      // used by the "coolerbg" code
  const mouse = { x: 0, y: 0, sx: 0, sy: 0, active: false, px: 0, py: 0 };

  /* Slow, drifting aurora ribbons */
  const AURORAS = [
    { hue: 235, y: 0.30, amp: 55, thick: 190, f: 0.0038, sp: 0.25,  ph: 0.0, a: 0.04 },
    { hue: 185, y: 0.65, amp: 60, thick: 190, f: 0.0033, sp: -0.20, ph: 3.0, a: 0.035 }
  ];

  /* CoolerBG: big drifting nebula clouds + brighter, hue-shifting aurora */
  const NEBULAE = [
    { x: 0.18, y: 0.28, r: 0.58, h: 280, sp: 0.09, ph: 0.0 },
    { x: 0.82, y: 0.22, r: 0.52, h: 190, sp: 0.07, ph: 1.7 },
    { x: 0.55, y: 0.82, r: 0.62, h: 320, sp: 0.06, ph: 3.1 },
    { x: 0.12, y: 0.86, r: 0.46, h: 215, sp: 0.10, ph: 4.4 },
    { x: 0.88, y: 0.72, r: 0.50, h: 175, sp: 0.08, ph: 5.6 }
  ];
  const AURORAS_COOL = [
    { hue: 175, y: 0.22, amp: 70, thick: 230, f: 0.0036, sp: 0.35,  ph: 0.0, a: 0.13 },
    { hue: 280, y: 0.46, amp: 80, thick: 250, f: 0.0030, sp: -0.28, ph: 2.0, a: 0.12 },
    { hue: 200, y: 0.68, amp: 75, thick: 240, f: 0.0034, sp: 0.30,  ph: 4.0, a: 0.12 },
    { hue: 330, y: 0.86, amp: 60, thick: 200, f: 0.0040, sp: -0.38, ph: 5.5, a: 0.10 }
  ];
  function drawNebula(t) {
    ctx.globalCompositeOperation = "lighter";
    const M = Math.max(W, H);
    for (const n of NEBULAE) {
      const cx = (n.x + 0.10 * Math.sin(t * n.sp + n.ph)) * W;
      const cy = (n.y + 0.08 * Math.cos(t * n.sp * 1.3 + n.ph)) * H;
      const R = n.r * M * (1 + 0.07 * Math.sin(t * 0.3 + n.ph));
      const hue = n.h + 32 * Math.sin(t * 0.22 + n.ph);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      g.addColorStop(0, "hsla(" + hue.toFixed(0) + ",100%,62%,0.26)");
      g.addColorStop(0.45, "hsla(" + ((hue + 40) % 360).toFixed(0) + ",100%,52%,0.11)");
      g.addColorStop(1, "hsla(" + hue.toFixed(0) + ",100%,50%,0)");
      ctx.fillStyle = g;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const lineCount = Math.max(6, Math.min(18, Math.round(W / 100)));
    while (lines.length < lineCount) lines.push(newLine(true));
    lines.length = lineCount;

    const starCount = Math.max(110, Math.min(380, Math.round(W * H / 6500))) + (cool ? 170 : 0);
    while (stars.length < starCount) stars.push(newStar());
    stars.length = starCount;
    linked = stars.filter(s => s.z > 0.5).slice(0, 130);

    if (reduceMotion) render(0, true);
  }

  /* ---- stars: z = depth (bigger = closer = faster drift + stronger parallax) ---- */
  function newStar() {
    const z = 0.15 + Math.pow(Math.random(), 1.6) * 0.85;
    return {
      x: Math.random(), y: Math.random(), z: z,
      r: 0.35 + z * 1.35,
      drift: z * rand(3, 9),
      phase: rand(0, TAU), tw: rand(0.5, 2.4),
      base: rand(0.4, 0.95),
      c: TINTS[(Math.random() * TINTS.length) | 0],
      sx: 0, sy: 0
    };
  }

  function place(s) {
    s.sx = (((s.x * W + mouse.px * s.z * 14) % W) + W) % W;
    s.sy = (((s.y * H + mouse.py * s.z * 9) % H) + H) % H;
  }

  function drawStars(t, still) {
    for (const s of stars) {
      let a = still ? s.base * 0.8 : s.base * (0.55 + 0.45 * Math.sin(t * s.tw + s.phase));
      if (cool && s.r > 0.9) {   // vivid glow + sparkle on the brighter stars
        const hue = 190 + ((s.phase * 57) % 150);
        const gr = s.r * (6 + 2.5 * Math.sin(t * s.tw + s.phase));
        const sg = ctx.createRadialGradient(s.sx, s.sy, 0, s.sx, s.sy, gr);
        sg.addColorStop(0, "hsla(" + hue.toFixed(0) + ",100%,75%," + (a * 0.55).toFixed(2) + ")");
        sg.addColorStop(1, "hsla(" + hue.toFixed(0) + ",100%,65%,0)");
        ctx.fillStyle = sg;
        ctx.fillRect(s.sx - gr, s.sy - gr, gr * 2, gr * 2);
        if (s.r > 1.35) {
          ctx.strokeStyle = "rgba(255,255,255," + (a * 0.6).toFixed(2) + ")";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(s.sx - gr * 1.5, s.sy); ctx.lineTo(s.sx + gr * 1.5, s.sy);
          ctx.moveTo(s.sx, s.sy - gr * 1.5); ctx.lineTo(s.sx, s.sy + gr * 1.5);
          ctx.stroke();
        }
      }
      if (boost > 3) {   // warp streaks
        ctx.strokeStyle = "rgba(" + s.c + "," + Math.min(0.9, a * 0.7).toFixed(2) + ")";
        ctx.lineWidth = Math.max(0.8, s.r * 0.9);
        ctx.beginPath();
        ctx.moveTo(s.sx, s.sy);
        ctx.lineTo(s.sx, s.sy - s.drift * boost * 0.07 - 2);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(" + s.c + "," + a.toFixed(2) + ")";
      if (s.r < 1) {
        ctx.fillRect(s.sx, s.sy, s.r * 1.4, s.r * 1.4);
      } else {
        ctx.beginPath();
        ctx.arc(s.sx, s.sy, s.r * 0.8, 0, TAU);
        ctx.fill();
        if (s.r > 1.4) {   // soft halo on the biggest stars
          ctx.fillStyle = "rgba(" + s.c + "," + (a * 0.12).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(s.sx, s.sy, s.r * 3.2, 0, TAU);
          ctx.fill();
        }
      }
    }
  }

  /* ---- constellations (stars close together connect) + cursor web ---- */
  function drawLinks() {
    ctx.lineWidth = 0.7;
    for (let i = 0; i < linked.length; i++) {
      const a = linked[i];
      for (let j = i + 1; j < linked.length; j++) {
        const b = linked[j];
        const dx = a.sx - b.sx, dy = a.sy - b.sy;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK_DIST * LINK_DIST) {
          const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.11;
          ctx.strokeStyle = "rgba(170,195,255," + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.stroke();
        }
      }
    }
  }

  /* ---- aurora ribbons ---- */
  function drawAurora(t, list) {
    ctx.globalCompositeOperation = "lighter";
    const step = 28;
    for (const b of list || AURORAS) {
      const base = b.y * H;
      const hue = b.hue + Math.sin(t * 0.1 + b.ph) * 22 + (cool ? 28 * Math.sin(t * 0.2 + b.ph) : 0);
      const g = ctx.createLinearGradient(0, base - b.amp, 0, base + b.thick + b.amp);
      g.addColorStop(0, "hsla(" + hue + ",90%,60%,0)");
      g.addColorStop(0.45, "hsla(" + hue + ",90%,62%," + b.a + ")");
      g.addColorStop(1, "hsla(" + hue + ",90%,60%,0)");
      ctx.fillStyle = g;
      const wave = x => base
        + Math.sin(x * b.f + t * b.sp + b.ph) * b.amp
        + Math.sin(x * b.f * 2.3 - t * b.sp * 1.7) * b.amp * 0.35;
      ctx.beginPath();
      ctx.moveTo(0, wave(0));
      for (let x = step; x <= W + step; x += step) ctx.lineTo(x, wave(x));
      for (let x = W + step; x >= 0; x -= step) ctx.lineTo(x, wave(x) + b.thick);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- glowing comets (several can fly at once) ---- */
  const COMET_HUES = [200, 280, 170, 320];
  function spawnComet() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const ang = rand(0.35, 0.85);
    const spd = rand(650, 1200);
    return {
      x: dir === 1 ? rand(-50, W * 0.6) : rand(W * 0.4, W + 50),
      y: rand(-30, H * 0.4),
      vx: Math.cos(ang) * spd * dir, vy: Math.sin(ang) * spd,
      spd: spd, len: rand(140, 280),
      life: 0, max: rand(0.8, 1.4),
      hue: COMET_HUES[(Math.random() * COMET_HUES.length) | 0]
    };
  }

  function drawComet(c) {
    const a = Math.sin(Math.PI * Math.min(c.life / c.max, 1));
    const tx = c.x - (c.vx / c.spd) * c.len;
    const ty = c.y - (c.vy / c.spd) * c.len;
    const g = ctx.createLinearGradient(tx, ty, c.x, c.y);
    g.addColorStop(0, "hsla(" + c.hue + ",100%,80%,0)");
    g.addColorStop(1, "hsla(" + c.hue + ",100%,88%," + (0.9 * a).toFixed(2) + ")");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(c.x, c.y);
    ctx.stroke();
    const h = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 10);
    h.addColorStop(0, "rgba(255,255,255," + a.toFixed(2) + ")");
    h.addColorStop(0.4, "hsla(" + c.hue + ",100%,80%," + (0.5 * a).toFixed(2) + ")");
    h.addColorStop(1, "hsla(" + c.hue + ",100%,70%,0)");
    ctx.fillStyle = h;
    ctx.fillRect(c.x - 10, c.y - 10, 20, 20);
  }

  /* ---- wandering colored lines ---- */
  function newLine(firstTime) {
    return {
      x: rand(0, W),
      y: -10,
      t: rand(0, 100),
      speed: rand(70, 170),
      trail: Math.floor(rand(100, 260)),
      a1: rand(0.25, 0.7), f1: rand(0.25, 0.8), p1: rand(0, 6.28),
      a2: rand(0.1, 0.35), f2: rand(0.8, 1.8), p2: rand(0, 6.28),
      width: rand(0.8, 1.6),
      alpha: rand(0.2, 0.45),
      hue: rand(200, 260),
      wait: firstTime ? rand(0, 4) : rand(0.2, 3),
      pts: []
    };
  }

  function stepLine(l, dt) {
    if (l.wait > 0) { l.wait -= dt; return; }
    const offscreen = l.y > H + 20;
    if (!offscreen) {
      l.t += dt;
      const ang = Math.PI / 2 + l.a1 * Math.sin(l.t * l.f1 + l.p1) + l.a2 * Math.sin(l.t * l.f2 + l.p2);
      l.x += Math.cos(ang) * l.speed * dt;
      l.y += Math.sin(ang) * l.speed * dt;
      l.pts.push(l.x, l.y);
      if (l.pts.length > l.trail * 2) l.pts.splice(0, 2);
    } else {
      l.pts.splice(0, 2);
      if (l.pts.length < 4) Object.assign(l, newLine(false), { x: rand(0, W) });
    }
  }

  function drawLine(l) {
    const n = l.pts.length / 2;
    if (n < 2) return;
    ctx.lineWidth = l.width;
    ctx.lineCap = "round";
    const CH = 12;   // segments per stroke (keeps the fade, far fewer draw calls)
    for (let i = 1; i < n; i += CH) {
      const end = Math.min(i + CH, n - 1);
      const fade = Math.pow(((i + end) / 2) / n, 1.6) * l.alpha * (cool ? 2.2 : 1);
      ctx.strokeStyle = cool
        ? "hsla(" + (l.hue + 50 * Math.sin(coolT * 0.4 + l.p1)).toFixed(0) + ",100%,72%," + Math.min(1, fade).toFixed(3) + ")"
        : "hsla(" + l.hue.toFixed(0) + ",40%,82%," + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(l.pts[(i - 1) * 2], l.pts[(i - 1) * 2 + 1]);
      for (let k = i; k <= end; k++) ctx.lineTo(l.pts[k * 2], l.pts[k * 2 + 1]);
      ctx.stroke();
    }
  }

  /* ---- cursor glow, click ripples + sparks ---- */
  function drawCursorGlow() {
    if (!mouse.active) return;
    const R = 240;
    const g = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, R);
    g.addColorStop(0, "rgba(130,160,255,0.14)");
    g.addColorStop(0.5, "rgba(150,110,255,0.05)");
    g.addColorStop(1, "rgba(120,150,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(mouse.sx - R, mouse.sy - R, R * 2, R * 2);
  }

  function burst(x, y, n) {
    n = n || 12;
    if (ripples.length < 14) ripples.push({ x: x, y: y, r: 0 });
    for (let i = 0; i < n && sparks.length < 700; i++) {
      const ang = rand(0, TAU), spd = rand(80, 260);
      sparks.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 0, max: rand(0.5, 1.0), hue: rand(190, 320)
      });
    }
  }

  function drawBursts() {
    for (const r of ripples) {
      const a = 1 - r.r / 280;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(170,200,255," + (a * 0.55).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = "rgba(200,170,255," + (a * 0.35).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * 0.6, 0, TAU);
      ctx.stroke();
    }
    for (const p of sparks) {
      const a = 1 - p.life / p.max;
      ctx.fillStyle = "hsla(" + p.hue.toFixed(0) + ",100%,80%," + a.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6 * a + 0.4, 0, TAU);
      ctx.fill();
    }
  }

  window.addEventListener("pointermove", e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (cool && sparks.length < 600) {
      for (let i = 0; i < 2; i++) {
        const ang = rand(0, TAU), spd = rand(15, 70);
        sparks.push({ x: mouse.x, y: mouse.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                      life: 0, max: rand(0.5, 1.1), hue: 190 + ((coolT * 40) % 150) });
      }
    }
    if (!mouse.active) { mouse.sx = mouse.x; mouse.sy = mouse.y; }
    mouse.active = true;
  }, { passive: true });
  window.addEventListener("pointerup", e => { if (e.pointerType === "touch") mouse.active = false; }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { mouse.active = false; });

  /* ---- update + render ---- */
  function update(t, dt) {
    // smooth cursor + parallax (gentle idle sway when no cursor)
    const k = Math.min(1, dt * 10);
    mouse.sx += (mouse.x - mouse.sx) * k;
    mouse.sy += (mouse.y - mouse.sy) * k;
    const tpx = mouse.active ? (mouse.x / W - 0.5) * 2 : Math.sin(t * 0.07) * 0.6;
    const tpy = mouse.active ? (mouse.y / H - 0.5) * 2 : Math.cos(t * 0.05) * 0.4;
    const pk = Math.min(1, dt * 2.5);
    mouse.px += (tpx - mouse.px) * pk;
    mouse.py += (tpy - mouse.py) * pk;

    boost += (boostTarget - boost) * Math.min(1, dt * 3);
    for (const s of stars) {
      s.y += s.drift * boost * dt / H;
      if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    }

    for (const l of lines) stepLine(l, dt);

    nextComet -= dt;
    if (nextComet <= 0 && comets.length < (cool ? 4 : 1)) { comets.push(spawnComet()); nextComet = cool ? rand(0.7, 2) : rand(6, 12); }
    for (const c of comets) { c.x += c.vx * dt; c.y += c.vy * dt; c.life += dt; }
    comets = comets.filter(c => c.life < c.max);

    for (const r of ripples) r.r += 420 * dt;
    ripples = ripples.filter(r => r.r < 280);
    const damp = Math.pow(0.04, dt);
    for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy = p.vy * damp + 60 * dt; p.life += dt; }
    sparks = sparks.filter(p => p.life < p.max);
  }

  function render(t, still) {
    coolT = t;
    ctx.clearRect(0, 0, W, H);
    if (cool) drawNebula(t);
    drawAurora(t, cool ? AURORAS_COOL : AURORAS);
    for (const s of stars) place(s);
    drawLinks();
    drawStars(t, still);
    if (still) return;
    ctx.globalCompositeOperation = "lighter";
    for (const l of lines) drawLine(l);
    for (const c of comets) drawComet(c);
    ctx.globalCompositeOperation = "source-over";
    drawBursts();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    update(t, dt);
    render(t, false);
    requestAnimationFrame(frame);
  }

  /* hooks used by the secret Codes */
  window.BG = {
    comets: n => { for (let i = 0; i < n; i++) setTimeout(() => comets.push(spawnComet()), i * 220); },
    burst: burst,
    stars: n => { for (let i = 0; i < n; i++) stars.push(newStar()); linked = stars.filter(s => s.z > 0.5).slice(0, 130); },
    cool: on => {
      cool = on;
      resize();
      linked = stars.filter(s => s.z > 0.5).slice(0, 130);
      if (on) for (let i = 0; i < 3; i++) setTimeout(() => comets.push(spawnComet()), i * 200);
    },
    warp: () => { boostTarget = 110; setTimeout(() => { boostTarget = 1; }, 3500); },
    reset: () => { boostTarget = 1; cool = false; resize(); stars.length = Math.max(110, Math.min(380, Math.round(W * H / 6500))); linked = stars.filter(s => s.z > 0.5).slice(0, 130); }
  };

  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>

<audio id="bgm" src="Ambientmusic1.mp3" loop preload="auto" autoplay></audio>
<script>
(function () {
  var bgm = document.getElementById("bgm");
  var muteBtn = document.getElementById("muteBtn");
  bgm.volume = 0.6;

  muteBtn.addEventListener("click", function () {
    bgm.muted = !bgm.muted;
    muteBtn.classList.toggle("muted", bgm.muted);
    var label = bgm.muted ? "Unmute music" : "Mute music";
    muteBtn.setAttribute("aria-label", label);
    muteBtn.title = label;
  });
  var events = ["pointerdown", "keydown", "touchstart", "click", "wheel", "mousemove"];

  function removeUnlock() {
    events.forEach(function (e) { window.removeEventListener(e, unlock, true); });
  }

  function unlock() {
    var p = bgm.play();
    if (p && p.then) {
      p.then(removeUnlock).catch(function () {});
    } else {
      removeUnlock();
    }
  }

  var attempt = bgm.play();
  if (attempt && attempt.catch) {
    attempt.catch(function () {
      events.forEach(function (e) { window.addEventListener(e, unlock, true); });
    });
  }
})();
</script>
