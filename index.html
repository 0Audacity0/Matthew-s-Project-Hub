<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew's Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space-black: #030305;      /* Outer Space Black background */
    --ink: #eceef2;
    --muted: #8b90a0;
    --line: rgba(255, 255, 255, 0.12);
    --panel: rgba(18, 19, 26, 0.92);
    --accent: #7aa2ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--space-black);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body { min-height: 100vh; }

  /* ---------- Fade in + move up on load ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    animation: riseIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: calc(var(--i, 0) * 120ms + 100ms);
  }
  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Animated background ---------- */
  #glow {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 34% at 18% 24%, rgba(88, 101, 242, 0.17), transparent 70%),
      radial-gradient(34% 30% at 82% 68%, rgba(0, 190, 175, 0.11), transparent 70%),
      radial-gradient(30% 28% at 72% 14%, rgba(168, 92, 225, 0.12), transparent 70%),
      radial-gradient(28% 26% at 28% 82%, rgba(60, 140, 255, 0.10), transparent 70%);
    animation: glowDrift 45s ease-in-out infinite alternate;
  }
  @keyframes glowDrift {
    from { transform: translate3d(-2%, -1.5%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.1); }
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  main { position: relative; z-index: 1; }

  /* ---------- Version label (top left) ---------- */
  .version {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 20;
    height: 38px;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    user-select: none;
  }

  /* ---------- Info button ---------- */
  .info-btn {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 20;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .info-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .info-btn:focus-visible, .close-btn:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ---------- Main content ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 90px 24px 120px;
  }

  section { margin-bottom: 72px; }

  h1.section-title {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 8px;
  }

  .section-rule {
    height: 1px;
    background: var(--line);
    margin: 18px 0 26px;
  }

  .empty {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
  }

  /* ---------- Website boxes ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .card {
    display: block;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .card:hover { border-color: rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.08); }
  .card-title { margin: 0; font-size: 17px; font-weight: 500; }
  .card-desc { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

  .warn {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    color: #ffc978;
    background: rgba(255, 190, 90, 0.12);
    border: 1px solid rgba(255, 190, 90, 0.35);
    border-radius: 999px;
  }

  .warn.tablet {
    color: #f3e08a;
    background: rgba(240, 215, 90, 0.10);
    border-color: rgba(240, 215, 90, 0.32);
  }

  .preview-box {
    margin-top: 12px;
    padding: 9px 12px;
    font-size: 13px;
    line-height: 1.45;
    color: #ff9a9a;
    background: rgba(255, 70, 70, 0.12);
    border: 1px solid rgba(255, 80, 80, 0.5);
    border-radius: 8px;
  }
  .preview-box strong { color: #ff6b6b; font-weight: 700; }

  /* ---------- Dropdown (Home-made Projects) ---------- */
  .more-wrap { margin-top: -40px; padding-bottom: 20px; }

  .more-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .more-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .more-btn .chev { display: inline-block; transition: transform 0.3s; font-size: 12px; }
  .more-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .dropdown {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.45s ease;
  }
  .dropdown.open { grid-template-rows: 1fr; }
  .dropdown-inner {
    min-height: 0;
    overflow: hidden;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .dropdown.open .dropdown-inner { visibility: visible; opacity: 1; }
  .dropdown-inner > .dropdown-content { padding-top: 48px; }

  /* ---------- Info popup ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .info-box {
    width: min(460px, 100%);
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 28px 28px;
    transform: translateY(14px) scale(0.98);
    transition: transform 0.25s;
  }
  .overlay.open .info-box { transform: none; }

  .info-box h2 {
    margin: 0 0 14px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
  }
  .info-box p {
    margin: 0 0 14px;
    color: #c9ccd6;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-line;
  }

  .close-btn {
    display: block;
    margin: 18px auto 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .close-btn:hover { background: rgba(255, 255, 255, 0.1); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation-duration: 0.01s; animation-delay: 0s; }
    .overlay, .info-box, .dropdown, .dropdown-inner, .more-btn .chev { transition: none; }
    #glow { animation: none; }
  }
</style>
</head>
<body>

<div id="glow" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="version reveal" id="version" style="--i:0"></div>

<button class="info-btn reveal" id="openInfo" style="--i:0" aria-haspopup="dialog">Info</button>

<main id="main"></main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="info-box">
    <h2 id="infoTitle">Info</h2>
    <div id="infoText"></div>
    <button class="close-btn" id="closeInfo">Close</button>
  </div>
</div>

<script>
/* =====================================================================
  Stop lookin' through my code
   ===================================================================== */

/* 1) The text inside the Info box.
      Each string is its own paragraph. Add, remove, or change lines freely.
      (Every line needs a comma at the end, except the last one.) */
const INFO_TEXT = [
  "Hallo, this is where I keep all of my current school projects and make them public to people!",
  "This is also meant for posting my 'Home Projects' like Voxel Project and Gambling Project and so on.",
  "Also, a lot of the school projects here will most likely not work on phones, so best if you use a tablet or computer!",
  "The newer a school project is, it will be put in the Newer Projects category, if a project is old, it will be put inside the Older Projects category. For the ones that are not too old or too new, they'll be put in the Semi-Old category."
];

/* 2) My projects.
      Put each site inside the section you want it to appear under.
      Copy a whole { ... }, line to add another one. The order here is the
      order they show up on the page (first = top left).
      (Every { ... } needs a comma after it, except the last one in a section.)

        name:        what the card is called
        url:         the GitHub Pages link (https://yourname.github.io/repo/)
        description: a short line under the name (can be left as "")
        mobile:      OPTIONAL warning tag on that box. Leave it out if the site
                     works fine on phones.
                       mobile: false      ->  "Not mobile supported"
                       mobile: "tablet"   ->  "Works on tablets, probably not phones"

        preview:     OPTIONAL. Put  preview: "yes"  at the end of a project to show
                     a red box inside it saying it's a placeholder and not released
                     yet. (preview: true works too.) Leave it out for released ones.

      Examples:
      { name: "My Site", url: "https://...", description: "...", mobile: false },
      { name: "My Site", url: "https://...", description: "...", mobile: "tablet" },   */
const PROJECTS = {
  "Newer Projects": [
    { name: "Banneker Project", url: "https://0audacity0.github.io/Banneker-Project/", description: "This was used in class during Week 9." },
    { name: "Cassini Project", url: "https://0audacity0.github.io/Cassini-Project/", description: "This was used in class during Week 7 or 8. (I think)", mobile: "tablet" }
  ],

  "Semi-Old Projects": [
    { name: "Galileo Project", url: "https://0audacity0.github.io/Galileo-Project/", description: "Forgot which week this was made.", mobile: "tablet" }
  ],

  "Older Projects": [
    { name: "Kepler Project", url: "https://0audacity0.github.io/Kepler-Project/", description: "Forgot which week this was made, and might be a little weird/buggy." },
    { name: "Planets Project", url: "https://0audacity0.github.io/Planets-Project/", description: "First project ever made, and quite frankly does not look all too appealing, considering my projects look better.", mobile: "tablet" }
  ]
};

/* 3) Your Home-made Projects (shows when you click the dropdown button
      under "Older Projects"). Same format as above. */
const HOME_PROJECTS = [
  { name: "Gamble Project", url: "https://0audacity0.github.io/Gamble-Project/", description: "LITERALLY just gambling with no life demolishing effects, everything is fake." },
  { name: "Voxel Project", url: "https://0audacity0.github.io/Voxel-Project/", description: "Almost like the game 'The Powder Toy' but with half the stuff inside it." },
  { name: "Plane Dodge", url: "https://0audacity0.github.io/PaperAirplaneDodge/", description: "Fly a plane, get crystals, crash 3 times and you're out. Pretty basic if you ask me." },
  { name: "Buckshot Roulette (But Bad)", url: "https://0audacity0.github.io/Buckshot-Roulette-but-bad/", description: " ", preview: "yes" }
];

/* 4) The version number shown in the top left corner. */
const VERSION = "v1.3.0";

/* =====================================================================
   Do NOT touch anything below this
   ===================================================================== */

document.getElementById("version").textContent = VERSION;

const main = document.getElementById("main");
let step = 1;

Object.entries(PROJECTS).forEach(([title, sites]) => {
  const section = document.createElement("section");
  section.className = "reveal";
  section.style.setProperty("--i", step++);

  const h = document.createElement("h1");
  h.className = "section-title";
  h.textContent = title;
  section.appendChild(h);

  const rule = document.createElement("div");
  rule.className = "section-rule";
  section.appendChild(rule);

  if (!sites.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No websites here yet.";
    section.appendChild(p);
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";
    sites.forEach(site => grid.appendChild(makeCard(site)));
    section.appendChild(grid);
  }

  main.appendChild(section);
});

/* Dropdown: "Home-made Projects" */
(function () {
  const wrap = document.createElement("div");
  wrap.className = "more-wrap reveal";
  wrap.style.setProperty("--i", step++);

  const btn = document.createElement("button");
  btn.className = "more-btn";
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", "homeDropdown");
  btn.innerHTML = 'More <span class="chev" aria-hidden="true">&#9660;</span>';

  const dd = document.createElement("div");
  dd.className = "dropdown";
  dd.id = "homeDropdown";

  const inner = document.createElement("div");
  inner.className = "dropdown-inner";
  const content = document.createElement("div");
  content.className = "dropdown-content";

  const h = document.createElement("h1");
  h.className = "section-title";
  h.textContent = "Projects";
  content.appendChild(h);

  const rule = document.createElement("div");
  rule.className = "section-rule";
  content.appendChild(rule);

  if (!HOME_PROJECTS.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No websites here yet.";
    content.appendChild(p);
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";
    HOME_PROJECTS.forEach(site => grid.appendChild(makeCard(site)));
    content.appendChild(grid);
  }

  inner.appendChild(content);
  dd.appendChild(inner);
  wrap.appendChild(btn);
  wrap.appendChild(dd);
  main.appendChild(wrap);

  btn.addEventListener("click", () => {
    const open = dd.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });
})();

function makeCard(site) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = site.url;
  card.target = "_blank";
  card.rel = "noopener";

  const name = document.createElement("h3");
  name.className = "card-title";
  name.textContent = site.name;
  card.appendChild(name);

  if (site.description) {
    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = site.description;
    card.appendChild(desc);
  }

  if (site.mobile === false || site.mobile === "tablet") {
    const warn = document.createElement("span");
    warn.className = "warn" + (site.mobile === "tablet" ? " tablet" : "");
    warn.textContent = site.mobile === "tablet"
      ? "\u26A0 Works on tablets, probably not phones"
      : "\u26A0 Not mobile supported";
    card.appendChild(warn);
  }
  if (site.preview === true || String(site.preview).toLowerCase() === "yes") {
    const box = document.createElement("div");
    box.className = "preview-box";
    box.innerHTML = "<strong>\u26A0 Placeholder</strong><br>This project is a placeholder and has not been released yet.";
    card.appendChild(box);
  }
  return card;
}

/* Info text */
const infoText = document.getElementById("infoText");
INFO_TEXT.forEach(line => {
  const p = document.createElement("p");
  p.textContent = line;
  infoText.appendChild(p);
});

/* Info popup open / close */
const overlay = document.getElementById("overlay");
const openBtn = document.getElementById("openInfo");
const closeBtn = document.getElementById("closeInfo");

function openInfo()  { overlay.classList.add("open"); closeBtn.focus(); }
function closeInfo() { overlay.classList.remove("open"); openBtn.focus(); }

openBtn.addEventListener("click", openInfo);
closeBtn.addEventListener("click", closeInfo);
overlay.addEventListener("click", e => { if (e.target === overlay) closeInfo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) closeInfo(); });

/* ---------- Background: nebula glow, twinkling stars, shooting stars, wandering lines ---------- */
(function () {
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const TINTS = ["255,255,255", "255,255,255", "255,255,255", "190,210,255", "255,225,190"];
  let W = 0, H = 0, lines = [], stars = [];
  let shooter = null, nextShooter = rand(2, 5);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const lineCount = Math.max(8, Math.min(24, Math.round(W / 80)));
    while (lines.length < lineCount) lines.push(newLine(true));
    lines.length = lineCount;

    const starCount = Math.max(90, Math.min(320, Math.round(W * H / 7000)));
    while (stars.length < starCount) stars.push(newStar());
    stars.length = starCount;

    if (reduceMotion) drawStars(0, true);
  }

  /* ---- stars (positions are 0..1 so they survive resizing) ---- */
  function newStar() {
    const r = Math.pow(Math.random(), 2.2) * 1.5 + 0.4; // mostly tiny, a few bigger
    return {
      x: Math.random(), y: Math.random(),
      r: r,
      drift: r * rand(1.5, 4),            // bigger = closer = drifts faster (px/sec)
      phase: rand(0, 6.28), tw: rand(0.5, 2.2),
      base: rand(0.35, 0.95),
      c: TINTS[Math.floor(Math.random() * TINTS.length)]
    };
  }

  function drawStars(t, still) {
    for (const s of stars) {
      const a = still ? s.base * 0.8 : s.base * (0.55 + 0.45 * Math.sin(t * s.tw + s.phase));
      ctx.fillStyle = "rgba(" + s.c + "," + a.toFixed(2) + ")";
      const x = s.x * W, y = s.y * H;
      if (s.r < 1) {
        ctx.fillRect(x, y, s.r * 1.4, s.r * 1.4);
      } else {
        ctx.beginPath();
        ctx.arc(x, y, s.r * 0.8, 0, 6.2832);
        ctx.fill();
      }
    }
  }

  function moveStars(dt) {
    for (const s of stars) {
      s.y += s.drift * dt / H;
      if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    }
  }

  /* ---- shooting stars ---- */
  function spawnShooter() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const ang = rand(0.4, 0.8);
    const spd = rand(700, 1100);
    return {
      x: dir === 1 ? rand(0, W * 0.6) : rand(W * 0.4, W),
      y: rand(-20, H * 0.35),
      vx: Math.cos(ang) * spd * dir, vy: Math.sin(ang) * spd,
      spd: spd, len: rand(120, 230),
      life: 0, max: rand(0.7, 1.2)
    };
  }

  function stepShooter(dt) {
    if (!shooter) {
      nextShooter -= dt;
      if (nextShooter <= 0) shooter = spawnShooter();
      return;
    }
    shooter.x += shooter.vx * dt;
    shooter.y += shooter.vy * dt;
    shooter.life += dt;
    if (shooter.life >= shooter.max) { shooter = null; nextShooter = rand(4, 10); }
  }

  function drawShooter() {
    if (!shooter) return;
    const s = shooter;
    const a = Math.sin(Math.PI * Math.min(s.life / s.max, 1));
    const tx = s.x - (s.vx / s.spd) * s.len;
    const ty = s.y - (s.vy / s.spd) * s.len;
    const g = ctx.createLinearGradient(tx, ty, s.x, s.y);
    g.addColorStop(0, "rgba(180,205,255,0)");
    g.addColorStop(1, "rgba(255,255,255," + (0.9 * a).toFixed(2) + ")");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.6, 0, 6.2832);
    ctx.fill();
  }

  /* ---- wandering lines ---- */
  function newLine(firstTime) {
    return {
      x: rand(0, W),
      y: -10,
      t: rand(0, 100),
      speed: rand(70, 170),            // pixels per second
      trail: Math.floor(rand(100, 260)), // how long the line is
      a1: rand(0.25, 0.7), f1: rand(0.25, 0.8), p1: rand(0, 6.28),
      a2: rand(0.1, 0.35), f2: rand(0.8, 1.8), p2: rand(0, 6.28),
      width: rand(0.8, 1.6),
      alpha: rand(0.3, 0.7),
      wait: firstTime ? rand(0, 4) : rand(0.2, 3), // seconds before it starts
      pts: []
    };
  }

  function stepLine(l, dt) {
    if (l.wait > 0) { l.wait -= dt; return; }
    const offscreen = l.y > H + 20;
    if (!offscreen) {
      l.t += dt;
      // Smooth wandering, always heading downward
      const ang = Math.PI / 2 + l.a1 * Math.sin(l.t * l.f1 + l.p1) + l.a2 * Math.sin(l.t * l.f2 + l.p2);
      l.x += Math.cos(ang) * l.speed * dt;
      l.y += Math.sin(ang) * l.speed * dt;
      l.pts.push(l.x, l.y);
      if (l.pts.length > l.trail * 2) l.pts.splice(0, 2);
    } else {
      l.pts.splice(0, 2); // head is gone, let the tail slide off
      if (l.pts.length < 4) Object.assign(l, newLine(false), { x: rand(0, W) });
    }
  }

  function drawLine(l) {
    const n = l.pts.length / 2;
    if (n < 2) return;
    ctx.lineWidth = l.width;
    ctx.lineCap = "round";
    for (let i = 1; i < n; i++) {
      const fade = Math.pow(i / n, 1.6) * l.alpha;
      ctx.strokeStyle = "rgba(255,255,255," + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(l.pts[(i - 1) * 2], l.pts[(i - 1) * 2 + 1]);
      ctx.lineTo(l.pts[i * 2], l.pts[i * 2 + 1]);
      ctx.stroke();
    }
  }

  /* ---- main loop ---- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    ctx.clearRect(0, 0, W, H);

    moveStars(dt);
    drawStars(now / 1000, false);

    for (const l of lines) { stepLine(l, dt); drawLine(l); }

    stepShooter(dt);
    drawShooter();

    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
