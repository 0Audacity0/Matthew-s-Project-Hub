<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew's Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space-black: #030305;      /* Outer Space Black background */
    --ink: #eceef2;
    --muted: #8b90a0;
    --line: rgba(255, 255, 255, 0.12);
    --panel: rgba(18, 19, 26, 0.92);
    --accent: #7aa2ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--space-black);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body { min-height: 100vh; }

  /* ---------- Fade in + move up on load ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    animation: riseIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    animation-delay: calc(var(--i, 0) * 120ms + 100ms);
  }
  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Animated background ---------- */
  #glow {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38% 34% at 18% 24%, rgba(88, 101, 242, 0.17), transparent 70%),
      radial-gradient(34% 30% at 82% 68%, rgba(0, 190, 175, 0.11), transparent 70%),
      radial-gradient(30% 28% at 72% 14%, rgba(168, 92, 225, 0.12), transparent 70%),
      radial-gradient(28% 26% at 28% 82%, rgba(60, 140, 255, 0.10), transparent 70%);
    animation: glowDrift 45s ease-in-out infinite alternate;
  }
  @keyframes glowDrift {
    from { transform: translate3d(-2%, -1.5%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.1); }
  }
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  main { position: relative; z-index: 1; }

  /* ---------- Version label (top left) ---------- */
  .version {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 20;
    height: 38px;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    user-select: none;
  }

  /* ---------- Info button ---------- */
  .info-btn {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 20;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .info-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .info-btn:focus-visible, .close-btn:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ---------- Main content ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 90px 24px 120px;
  }

  section { margin-bottom: 72px; }

  h1.section-title {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 8px;
  }

  .section-rule {
    height: 1px;
    background: var(--line);
    margin: 18px 0 26px;
  }

  .empty {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
  }

  /* ---------- Website boxes ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .card {
    --mx: 50%;
    --my: 50%;
    position: relative;
    display: block;
    overflow: hidden;
    padding: 18px 20px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 10px 26px rgba(0, 0, 0, 0.3);
    color: inherit;
    text-decoration: none;
    transition: transform 0.25s ease, border-color 0.25s, box-shadow 0.25s;
  }
  /* soft spotlight that follows the cursor */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    background: radial-gradient(240px circle at var(--mx) var(--my), rgba(122, 162, 255, 0.2), transparent 65%);
  }
  /* thin glowing line along the top edge */
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 1px;
    pointer-events: none;
    opacity: 0.35;
    transition: opacity 0.25s;
    background: linear-gradient(90deg, transparent, rgba(122, 162, 255, 0.8), transparent);
  }
  .card > * { position: relative; }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(122, 162, 255, 0.55);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset, 0 16px 34px rgba(0, 0, 0, 0.4), 0 0 28px rgba(122, 162, 255, 0.16);
  }
  .card:hover::before, .card:hover::after { opacity: 1; }
  .card-title {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-arrow {
    flex: none;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.3;
    transition: transform 0.25s ease, color 0.25s;
  }
  .card:hover .card-arrow { transform: translate(3px, -3px); color: var(--accent); }
  .card-desc { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

  .warn {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    color: #ffc978;
    background: rgba(255, 190, 90, 0.12);
    border: 1px solid rgba(255, 190, 90, 0.35);
    border-radius: 999px;
  }

  .warn.tablet {
    color: #f3e08a;
    background: rgba(240, 215, 90, 0.10);
    border-color: rgba(240, 215, 90, 0.32);
  }

  .preview-box {
    margin-top: 12px;
    padding: 9px 12px;
    font-size: 13px;
    line-height: 1.45;
    color: #ff9a9a;
    background: rgba(255, 70, 70, 0.12);
    border: 1px solid rgba(255, 80, 80, 0.5);
    border-radius: 8px;
  }
  .preview-box strong { color: #ff6b6b; font-weight: 700; }

  /* ---------- Dropdown (Home-made Projects) ---------- */
  .more-wrap { margin-top: -40px; padding-bottom: 20px; }

  .more-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .more-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.3); }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .more-btn .chev { display: inline-block; transition: transform 0.3s; font-size: 12px; }
  .more-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .dropdown {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.45s ease;
  }
  .dropdown.open { grid-template-rows: 1fr; }
  .dropdown-inner {
    min-height: 0;
    overflow: hidden;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  .dropdown.open .dropdown-inner { visibility: visible; opacity: 1; }
  .dropdown-inner > .dropdown-content { padding-top: 48px; }

  /* ---------- Info popup ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .info-box {
    width: min(460px, 100%);
    max-height: 80vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 28px 28px;
    transform: translateY(14px) scale(0.98);
    transition: transform 0.25s;
  }
  .overlay.open .info-box { transform: none; }

  .info-box h2 {
    margin: 0 0 14px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
  }
  .info-box p {
    margin: 0 0 14px;
    color: #c9ccd6;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-line;
  }

  .close-btn {
    display: block;
    margin: 18px auto 0;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .close-btn:hover { background: rgba(255, 255, 255, 0.1); }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation-duration: 0.01s; animation-delay: 0s; }
    .overlay, .info-box, .dropdown, .dropdown-inner, .more-btn .chev, .card, .card::before, .card::after, .card-arrow { transition: none; }
    .card:hover { transform: none; }
    #glow { animation: none; }
  }
</style>
</head>
<body>

<div id="glow" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="version reveal" id="version" style="--i:0"></div>

<button class="info-btn reveal" id="openInfo" style="--i:0" aria-haspopup="dialog">Info</button>

<main id="main"></main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="info-box">
    <h2 id="infoTitle">Info</h2>
    <div id="infoText"></div>
    <button class="close-btn" id="closeInfo">Close</button>
  </div>
</div>

<div class="overlay" id="soonOverlay" role="dialog" aria-modal="true" aria-labelledby="soonText">
  <div class="info-box">
    <p id="soonText" style="text-align:center; font-size:17px; margin:0;"></p>
    <button class="close-btn" id="closeSoon">Close</button>
  </div>
</div>

<script>
/* =====================================================================
  Stop lookin' through my code
   ===================================================================== */

/* 1) The text inside the Info box.
      Each string is its own paragraph. Add, remove, or change lines freely.
      (Every line needs a comma at the end, except the last one.) */
const INFO_TEXT = [
  "Hallo, this is where I keep all of my current school projects and make them public to people!",
  "This is also meant for posting my 'Home Projects' like Voxel Project and Gambling Project and so on.",
  "Also, a lot of the school projects here will most likely not work on phones, so best if you use a tablet or computer!",
  "The newer a school project is, it will be put in the Newer Projects category, if a project is old, it will be put inside the Older Projects category. For the ones that are not too old or too new, they'll be put in the Semi-Old category.",
  "Oh, and don't try and find a way to get past previewed projects."
];

/* 2) My projects.
      Put each site inside the section you want it to appear under.
      Copy a whole { ... }, line to add another one. The order here is the
      order they show up on the page (first = top left).
      (Every { ... } needs a comma after it, except the last one in a section.)

        name:        what the card is called
        url:         the GitHub Pages link (https://yourname.github.io/repo/)
        description: a short line under the name (can be left as "")
        mobile:      OPTIONAL warning tag on that box. Leave it out if the site
                     works fine on phones.
                       mobile: false      ->  "Not mobile supported"
                       mobile: "tablet"   ->  "Works on tablets, probably not phones"

        preview:     OPTIONAL. Put  preview: "yes"  at the end of a project to show
                     a red box inside it saying it's a placeholder and not released
                     yet. (preview: true works too.) Leave it out for released ones.

      Examples:
      { name: "My Site", url: "https://...", description: "...", mobile: false },
      { name: "My Site", url: "https://...", description: "...", mobile: "tablet" },   */
const PROJECTS = {
  "Newer Projects": [
    { name: "Banneker Project", url: "https://0audacity0.github.io/Banneker-Project/", description: "This was used in class during Week 9." },
    { name: "Cassini Project", url: "https://0audacity0.github.io/Cassini-Project/", description: "This was used in class during Week 7 or 8. (I think)", mobile: "tablet" }
  ],

  "Semi-Old Projects": [
    { name: "Galileo Project", url: "https://0audacity0.github.io/Galileo-Project/", description: "Forgot which week this was made.", mobile: "tablet" }
  ],

  "Older Projects": [
    { name: "Kepler Project", url: "https://0audacity0.github.io/Kepler-Project/", description: "Forgot which week this was made, and might be a little weird/buggy." },
    { name: "Planets Project", url: "https://0audacity0.github.io/Planets-Project/", description: "First project ever made, and quite frankly does not look all too appealing, considering my projects look better.", mobile: "tablet" }
  ]
};

/* 3) Your Home-made Projects (shows when you click the dropdown button
      under "Older Projects"). Same format as above. */
const HOME_PROJECTS = [
  { name: "Gamble Project", url: "https://0audacity0.github.io/Gamble-Project/", description: "LITERALLY just gambling with no life demolishing effects, everything is fake." },
  { name: "Voxel Project", url: "https://0audacity0.github.io/Voxel-Project/", description: "Almost like the game 'The Powder Toy' but with half the stuff inside it." },
  { name: "Plane Dodge", url: "https://0audacity0.github.io/PaperAirplaneDodge/", description: "Fly a plane, get crystals, crash 3 times and you're out. Pretty basic if you ask me." },
  { name: "Buckshot Roulette But Bad (Or better?)", url: "https://0audacity0.github.io/Be-Patient-Yo/", description: " ", preview: "yes", releaseDate: "October 24th, 2026" }
];

/* 4) The version number shown in the top left corner. */
const VERSION = "v1.4.0";

/* =====================================================================
   Do NOT touch anything below this
   ===================================================================== */

document.getElementById("version").textContent = VERSION;

const main = document.getElementById("main");
let step = 1;

Object.entries(PROJECTS).forEach(([title, sites]) => {
  const section = document.createElement("section");
  section.className = "reveal";
  section.style.setProperty("--i", step++);

  const h = document.createElement("h1");
  h.className = "section-title";
  h.textContent = title;
  section.appendChild(h);

  const rule = document.createElement("div");
  rule.className = "section-rule";
  section.appendChild(rule);

  if (!sites.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No websites here yet.";
    section.appendChild(p);
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";
    sites.forEach(site => grid.appendChild(makeCard(site)));
    section.appendChild(grid);
  }

  main.appendChild(section);
});

/* Dropdown: "Home-made Projects" */
(function () {
  const wrap = document.createElement("div");
  wrap.className = "more-wrap reveal";
  wrap.style.setProperty("--i", step++);

  const btn = document.createElement("button");
  btn.className = "more-btn";
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", "homeDropdown");
  btn.innerHTML = 'More <span class="chev" aria-hidden="true">&#9660;</span>';

  const dd = document.createElement("div");
  dd.className = "dropdown";
  dd.id = "homeDropdown";

  const inner = document.createElement("div");
  inner.className = "dropdown-inner";
  const content = document.createElement("div");
  content.className = "dropdown-content";

  const h = document.createElement("h1");
  h.className = "section-title";
  h.textContent = "Projects";
  content.appendChild(h);

  const rule = document.createElement("div");
  rule.className = "section-rule";
  content.appendChild(rule);

  if (!HOME_PROJECTS.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No websites here yet.";
    content.appendChild(p);
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";
    HOME_PROJECTS.forEach(site => grid.appendChild(makeCard(site)));
    content.appendChild(grid);
  }

  inner.appendChild(content);
  dd.appendChild(inner);
  wrap.appendChild(btn);
  wrap.appendChild(dd);
  main.appendChild(wrap);

  btn.addEventListener("click", () => {
    const open = dd.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });
})();

function makeCard(site) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = site.url;
  card.target = "_blank";
  card.rel = "noopener";
  card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  const name = document.createElement("h3");
  name.className = "card-title";
  name.textContent = site.name;
  const arrow = document.createElement("span");
  arrow.className = "card-arrow";
  arrow.setAttribute("aria-hidden", "true");
  arrow.textContent = "\u2197";
  if (!(site.preview === true || String(site.preview).toLowerCase() === "yes")) name.appendChild(arrow);
  card.appendChild(name);

  if (site.description) {
    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = site.description;
    card.appendChild(desc);
  }

  if (site.mobile === false || site.mobile === "tablet") {
    const warn = document.createElement("span");
    warn.className = "warn" + (site.mobile === "tablet" ? " tablet" : "");
    warn.textContent = site.mobile === "tablet"
      ? "\u26A0 Works on tablets, probably not phones"
      : "\u26A0 Not mobile supported";
    card.appendChild(warn);
  }
  if (site.preview === true || String(site.preview).toLowerCase() === "yes") {
    const box = document.createElement("div");
    box.className = "preview-box";
    box.innerHTML = "<strong>\u26A0 Placeholder</strong><br>This project is a placeholder and has not been released yet.";
    card.appendChild(box);

    // Placeholder projects don't open; they show the "be patient" popup instead
    card.addEventListener("click", e => {
      e.preventDefault();
      openSoon(site.releaseDate);
    });
  }
  return card;
}

/* Info text */
const infoText = document.getElementById("infoText");
INFO_TEXT.forEach(line => {
  const p = document.createElement("p");
  p.textContent = line;
  infoText.appendChild(p);
});

/* Info popup open / close */
const overlay = document.getElementById("overlay");
const openBtn = document.getElementById("openInfo");
const closeBtn = document.getElementById("closeInfo");

function openInfo()  { overlay.classList.add("open"); closeBtn.focus(); }
function closeInfo() { overlay.classList.remove("open"); openBtn.focus(); }

openBtn.addEventListener("click", openInfo);
closeBtn.addEventListener("click", closeInfo);
overlay.addEventListener("click", e => { if (e.target === overlay) closeInfo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) closeInfo(); });

/* "Coming soon" popup for placeholder projects */
const soonOverlay = document.getElementById("soonOverlay");
const soonText = document.getElementById("soonText");
const closeSoonBtn = document.getElementById("closeSoon");
let soonOpener = null;

function openSoon(date) {
  soonOpener = document.activeElement;
  soonText.textContent = "This will be released on " + (date || "a date to be announced") + ", so please be patient";
  soonOverlay.classList.add("open");
  closeSoonBtn.focus();
}
function closeSoon() {
  soonOverlay.classList.remove("open");
  if (soonOpener && soonOpener.focus) soonOpener.focus();
}
closeSoonBtn.addEventListener("click", closeSoon);
soonOverlay.addEventListener("click", e => { if (e.target === soonOverlay) closeSoon(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && soonOverlay.classList.contains("open")) closeSoon(); });

/* ---------- Background: parallax starfield, constellations, aurora, comets, cursor glow ---------- */
(function () {
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const TINTS = ["255,255,255", "255,255,255", "190,210,255", "255,225,190", "205,185,255", "165,240,255"];
  const LINK_DIST = 110;    // how close stars must be to connect into constellations
  const MOUSE_DIST = 180;   // how far the cursor "web" reaches

  let W = 0, H = 0;
  let stars = [], linked = [], lines = [], comets = [], ripples = [], sparks = [];
  let nextComet = rand(3, 6);
  const mouse = { x: 0, y: 0, sx: 0, sy: 0, active: false, px: 0, py: 0 };

  /* Slow, drifting aurora ribbons */
  const AURORAS = [
    { hue: 235, y: 0.30, amp: 55, thick: 190, f: 0.0038, sp: 0.25,  ph: 0.0, a: 0.04 },
    { hue: 185, y: 0.65, amp: 60, thick: 190, f: 0.0033, sp: -0.20, ph: 3.0, a: 0.035 }
  ];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const lineCount = Math.max(6, Math.min(18, Math.round(W / 100)));
    while (lines.length < lineCount) lines.push(newLine(true));
    lines.length = lineCount;

    const starCount = Math.max(110, Math.min(380, Math.round(W * H / 6500)));
    while (stars.length < starCount) stars.push(newStar());
    stars.length = starCount;
    linked = stars.filter(s => s.z > 0.5).slice(0, 130);

    if (reduceMotion) render(0, true);
  }

  /* ---- stars: z = depth (bigger = closer = faster drift + stronger parallax) ---- */
  function newStar() {
    const z = 0.15 + Math.pow(Math.random(), 1.6) * 0.85;
    return {
      x: Math.random(), y: Math.random(), z: z,
      r: 0.35 + z * 1.35,
      drift: z * rand(3, 9),
      phase: rand(0, TAU), tw: rand(0.5, 2.4),
      base: rand(0.4, 0.95),
      c: TINTS[(Math.random() * TINTS.length) | 0],
      sx: 0, sy: 0
    };
  }

  function place(s) {
    s.sx = (((s.x * W + mouse.px * s.z * 14) % W) + W) % W;
    s.sy = (((s.y * H + mouse.py * s.z * 9) % H) + H) % H;
  }

  function drawStars(t, still) {
    for (const s of stars) {
      let a = still ? s.base * 0.8 : s.base * (0.55 + 0.45 * Math.sin(t * s.tw + s.phase));
      ctx.fillStyle = "rgba(" + s.c + "," + a.toFixed(2) + ")";
      if (s.r < 1) {
        ctx.fillRect(s.sx, s.sy, s.r * 1.4, s.r * 1.4);
      } else {
        ctx.beginPath();
        ctx.arc(s.sx, s.sy, s.r * 0.8, 0, TAU);
        ctx.fill();
        if (s.r > 1.4) {   // soft halo on the biggest stars
          ctx.fillStyle = "rgba(" + s.c + "," + (a * 0.12).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(s.sx, s.sy, s.r * 3.2, 0, TAU);
          ctx.fill();
        }
      }
    }
  }

  /* ---- constellations (stars close together connect) + cursor web ---- */
  function drawLinks() {
    ctx.lineWidth = 0.7;
    for (let i = 0; i < linked.length; i++) {
      const a = linked[i];
      for (let j = i + 1; j < linked.length; j++) {
        const b = linked[j];
        const dx = a.sx - b.sx, dy = a.sy - b.sy;
        const d2 = dx * dx + dy * dy;
        if (d2 < LINK_DIST * LINK_DIST) {
          const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.11;
          ctx.strokeStyle = "rgba(170,195,255," + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.stroke();
        }
      }
    }
  }

  /* ---- aurora ribbons ---- */
  function drawAurora(t) {
    ctx.globalCompositeOperation = "lighter";
    const step = 28;
    for (const b of AURORAS) {
      const base = b.y * H;
      const hue = b.hue + Math.sin(t * 0.1 + b.ph) * 22;
      const g = ctx.createLinearGradient(0, base - b.amp, 0, base + b.thick + b.amp);
      g.addColorStop(0, "hsla(" + hue + ",90%,60%,0)");
      g.addColorStop(0.45, "hsla(" + hue + ",90%,62%," + b.a + ")");
      g.addColorStop(1, "hsla(" + hue + ",90%,60%,0)");
      ctx.fillStyle = g;
      const wave = x => base
        + Math.sin(x * b.f + t * b.sp + b.ph) * b.amp
        + Math.sin(x * b.f * 2.3 - t * b.sp * 1.7) * b.amp * 0.35;
      ctx.beginPath();
      ctx.moveTo(0, wave(0));
      for (let x = step; x <= W + step; x += step) ctx.lineTo(x, wave(x));
      for (let x = W + step; x >= 0; x -= step) ctx.lineTo(x, wave(x) + b.thick);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- glowing comets (several can fly at once) ---- */
  const COMET_HUES = [200, 280, 170, 320];
  function spawnComet() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const ang = rand(0.35, 0.85);
    const spd = rand(650, 1200);
    return {
      x: dir === 1 ? rand(-50, W * 0.6) : rand(W * 0.4, W + 50),
      y: rand(-30, H * 0.4),
      vx: Math.cos(ang) * spd * dir, vy: Math.sin(ang) * spd,
      spd: spd, len: rand(140, 280),
      life: 0, max: rand(0.8, 1.4),
      hue: COMET_HUES[(Math.random() * COMET_HUES.length) | 0]
    };
  }

  function drawComet(c) {
    const a = Math.sin(Math.PI * Math.min(c.life / c.max, 1));
    const tx = c.x - (c.vx / c.spd) * c.len;
    const ty = c.y - (c.vy / c.spd) * c.len;
    const g = ctx.createLinearGradient(tx, ty, c.x, c.y);
    g.addColorStop(0, "hsla(" + c.hue + ",100%,80%,0)");
    g.addColorStop(1, "hsla(" + c.hue + ",100%,88%," + (0.9 * a).toFixed(2) + ")");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(c.x, c.y);
    ctx.stroke();
    const h = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 10);
    h.addColorStop(0, "rgba(255,255,255," + a.toFixed(2) + ")");
    h.addColorStop(0.4, "hsla(" + c.hue + ",100%,80%," + (0.5 * a).toFixed(2) + ")");
    h.addColorStop(1, "hsla(" + c.hue + ",100%,70%,0)");
    ctx.fillStyle = h;
    ctx.fillRect(c.x - 10, c.y - 10, 20, 20);
  }

  /* ---- wandering colored lines ---- */
  function newLine(firstTime) {
    return {
      x: rand(0, W),
      y: -10,
      t: rand(0, 100),
      speed: rand(70, 170),
      trail: Math.floor(rand(100, 260)),
      a1: rand(0.25, 0.7), f1: rand(0.25, 0.8), p1: rand(0, 6.28),
      a2: rand(0.1, 0.35), f2: rand(0.8, 1.8), p2: rand(0, 6.28),
      width: rand(0.8, 1.6),
      alpha: rand(0.2, 0.45),
      hue: rand(200, 260),
      wait: firstTime ? rand(0, 4) : rand(0.2, 3),
      pts: []
    };
  }

  function stepLine(l, dt) {
    if (l.wait > 0) { l.wait -= dt; return; }
    const offscreen = l.y > H + 20;
    if (!offscreen) {
      l.t += dt;
      const ang = Math.PI / 2 + l.a1 * Math.sin(l.t * l.f1 + l.p1) + l.a2 * Math.sin(l.t * l.f2 + l.p2);
      l.x += Math.cos(ang) * l.speed * dt;
      l.y += Math.sin(ang) * l.speed * dt;
      l.pts.push(l.x, l.y);
      if (l.pts.length > l.trail * 2) l.pts.splice(0, 2);
    } else {
      l.pts.splice(0, 2);
      if (l.pts.length < 4) Object.assign(l, newLine(false), { x: rand(0, W) });
    }
  }

  function drawLine(l) {
    const n = l.pts.length / 2;
    if (n < 2) return;
    ctx.lineWidth = l.width;
    ctx.lineCap = "round";
    for (let i = 1; i < n; i++) {
      const fade = Math.pow(i / n, 1.6) * l.alpha;
      ctx.strokeStyle = "hsla(" + l.hue.toFixed(0) + ",40%,82%," + fade.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(l.pts[(i - 1) * 2], l.pts[(i - 1) * 2 + 1]);
      ctx.lineTo(l.pts[i * 2], l.pts[i * 2 + 1]);
      ctx.stroke();
    }
  }

  /* ---- cursor glow, click ripples + sparks ---- */
  function drawCursorGlow() {
    if (!mouse.active) return;
    const R = 240;
    const g = ctx.createRadialGradient(mouse.sx, mouse.sy, 0, mouse.sx, mouse.sy, R);
    g.addColorStop(0, "rgba(130,160,255,0.14)");
    g.addColorStop(0.5, "rgba(150,110,255,0.05)");
    g.addColorStop(1, "rgba(120,150,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(mouse.sx - R, mouse.sy - R, R * 2, R * 2);
  }

  function burst(x, y) {
    if (ripples.length < 6) ripples.push({ x: x, y: y, r: 0 });
    for (let i = 0; i < 12 && sparks.length < 120; i++) {
      const ang = rand(0, TAU), spd = rand(80, 260);
      sparks.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 0, max: rand(0.5, 1.0), hue: rand(190, 320)
      });
    }
  }

  function drawBursts() {
    for (const r of ripples) {
      const a = 1 - r.r / 280;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(170,200,255," + (a * 0.55).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = "rgba(200,170,255," + (a * 0.35).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * 0.6, 0, TAU);
      ctx.stroke();
    }
    for (const p of sparks) {
      const a = 1 - p.life / p.max;
      ctx.fillStyle = "hsla(" + p.hue.toFixed(0) + ",100%,80%," + a.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6 * a + 0.4, 0, TAU);
      ctx.fill();
    }
  }

  window.addEventListener("pointermove", e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (!mouse.active) { mouse.sx = mouse.x; mouse.sy = mouse.y; }
    mouse.active = true;
  }, { passive: true });
  window.addEventListener("pointerup", e => { if (e.pointerType === "touch") mouse.active = false; }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { mouse.active = false; });

  /* ---- update + render ---- */
  function update(t, dt) {
    // smooth cursor + parallax (gentle idle sway when no cursor)
    const k = Math.min(1, dt * 10);
    mouse.sx += (mouse.x - mouse.sx) * k;
    mouse.sy += (mouse.y - mouse.sy) * k;
    const tpx = mouse.active ? (mouse.x / W - 0.5) * 2 : Math.sin(t * 0.07) * 0.6;
    const tpy = mouse.active ? (mouse.y / H - 0.5) * 2 : Math.cos(t * 0.05) * 0.4;
    const pk = Math.min(1, dt * 2.5);
    mouse.px += (tpx - mouse.px) * pk;
    mouse.py += (tpy - mouse.py) * pk;

    for (const s of stars) {
      s.y += s.drift * dt / H;
      if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    }

    for (const l of lines) stepLine(l, dt);

    nextComet -= dt;
    if (nextComet <= 0 && comets.length < 1) { comets.push(spawnComet()); nextComet = rand(6, 12); }
    for (const c of comets) { c.x += c.vx * dt; c.y += c.vy * dt; c.life += dt; }
    comets = comets.filter(c => c.life < c.max);

    for (const r of ripples) r.r += 420 * dt;
    ripples = ripples.filter(r => r.r < 280);
    const damp = Math.pow(0.04, dt);
    for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy = p.vy * damp + 60 * dt; p.life += dt; }
    sparks = sparks.filter(p => p.life < p.max);
  }

  function render(t, still) {
    ctx.clearRect(0, 0, W, H);
    drawAurora(t);
    for (const s of stars) place(s);
    drawLinks();
    drawStars(t, still);
    if (still) return;
    ctx.globalCompositeOperation = "lighter";
    for (const l of lines) drawLine(l);
    for (const c of comets) drawComet(c);
    ctx.globalCompositeOperation = "source-over";
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    update(t, dt);
    render(t, false);
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
